name: Docker Image CI

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Login to Docker Hub
      run: |
        echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
      
    - name: Set Environment Variables
      run: |
        echo "MONGO_CONNECTION_STRING=${{ secrets.MONGO_CONNECTION_STRING }}" > .env
        echo "REDIS_URL=${{ secrets.REDIS_URL }}" >> .env
        echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env
        echo "JWT_REFRESH_SECRET_KEY=${{ secrets.JWT_REFRESH_SECRET_KEY }}" >> .env
        echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env
        echo "STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}" >> .env
        echo "CLOUD_NAME=${{ secrets.CLOUD_NAME }}" >> .env
        echo "CLOUD_API_KEY=${{ secrets.CLOUD_API_KEY }}" >> .env
        echo "CLOUD_API_SECRET=${{ secrets.CLOUD_API_SECRET }}" >> .env
        echo "PORT=5000" >> .env
        echo "ORIGIN=*" >> .env

    - name: Build the Docker image
      run: docker build . -t rishikt/elearn-backend:latest

    - name: Push to Docker Hub
      run: docker push rishikt/elearn-backend:latest
