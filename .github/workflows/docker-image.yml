name: Docker Image CI

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Login to Docker Hub
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      
    - name: Set Environment Variables
      env:
        MONGO_CONNECTION_STRING: ${{ secrets.MONGO_CONNECTION_STRING }}
        REDIS_URL: ${{ secrets.REDIS_URL }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        JWT_REFRESH_SECRET_KEY: ${{ secrets.JWT_REFRESH_SECRET_KEY }}
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        CLOUD_NAME: ${{ secrets.CLOUD_NAME }}
        CLOUD_API_KEY: ${{ secrets.CLOUD_API_KEY }}
        CLOUD_API_SECRET: ${{ secrets.CLOUD_API_SECRET }}
      run: |
        echo "MONGO_CONNECTION_STRING=$MONGO_CONNECTION_STRING" > .env
        echo "REDIS_URL=$REDIS_URL" >> .env
        echo "JWT_SECRET_KEY=$JWT_SECRET_KEY" >> .env
        echo "JWT_REFRESH_SECRET_KEY=$JWT_REFRESH_SECRET_KEY" >> .env
        echo "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY" >> .env
        echo "STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY" >> .env
        echo "CLOUD_NAME=$CLOUD_NAME" >> .env
        echo "CLOUD_API_KEY=$CLOUD_API_KEY" >> .env
        echo "CLOUD_API_SECRET=$CLOUD_API_SECRET" >> .env
        echo "PORT=5000" >> .env
        echo "ORIGIN=*" >> .env

    - name: Build the Docker image
      run: docker build . -t rishikt/elearn-backend:latest

    - name: Push to Docker Hub
      run: docker push rishikt/elearn-backend:latest
